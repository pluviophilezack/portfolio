<!DOCTYPE html>

<html lang="en">
    <head>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4" crossorigin="anonymous"></script>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
        <link href="css/styles.css" rel="stylesheet">
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

        <title>Zack, YOU's blog</title>

        <meta name="viewport" content="width=device-width, initial-scale=1.0">

    </head>
    <body style='background-color: #FFF8E7;'>
        <div class='bar'>
            <a href="index.html">
                <h1 class='small_logo'>Zack YOU</h1>
            </a>
            <ul>
                <li>
                    <a class='tab' href='project.html'>PROJECT</a>
                </li>
                <li>
                    <a class='tab' href='about-me.html'>ABOUT ME</a>
                </li>
                <li>
                    <a class='tab' href='blog.html'>BLOG</a>
                </li>
            </ul>
        </div>

        <h1 id='title_blog'>Blog</h1>

        <!-- Bookshelf start from here-->
        <div class='block' id='straw'>
            <h1 id='title2'>
                Plastic Reduction Policy.
            </h1>
            <p class='abstract'>
                I proposed a policy to reduce plastic straws in tea shops.
            </p>
        </div>

        <div class='block' id='doggy'>
            <h1 id='title2'>
                Doggy
            </h1>
            <p class='abstract'>
                A story about dog and life.
            </p>
            <img class= 'cover' alt="Cover of my blog page." src="images/doggy.jpg">
        </div>

        <!-- Bookshelf ends -->

        <div class='bar'>
            <b>Subscribe to my blog!</b>
            <form>
                <input autofocus id='email' placeholder="Type your email" type="text">
                <input type="submit">
            </form>
        </div>

        <script>
            document.addEventListener('DOMContentLoaded', function() {
                document.querySelector('form').addEventListener('submit', function(e) {
                    e.preventDefault();
                    setTimeout(function() {
                        alert('Submit successfully.\nCheck your email.');
                    }, 2000);
                });
            });

            $(document).ready(function(){
                $(".block").fadeIn(3000);
            });

            document.querySelector('#straw').onclick = function() {
                window.open('https://www.facebook.com/share/p/19YjqfqNMz/', '_blank');
            }
            document.querySelector('#doggy').onclick = function() {
                window.open('https://www.facebook.com/share/p/1Cog7R4Gjy/', '_blank');
            }


        </script>

    </body>
</html>
